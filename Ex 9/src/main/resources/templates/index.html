<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spring Boot MVC CRUD</title>
<link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="main-container">

    <h1 class="main-title">Spring Boot MVC CRUD</h1>

    <!-- Employee Records Header -->
    <div class="section-header">
        <h2 class="section-title">Employee Records</h2>
        <a href="#employee-form" class="btn-add">+ Add Employee</a>
    </div>

    <!-- Employee Table -->
    <table class="table">
        <thead>
            <tr>
                <th style="width: 8%;">ID</th>
                <th style="width: 22%;">Name</th>
                <th style="width: 26%;">Email</th>
                <th style="width: 18%;">Department</th>
                <th style="width: 12%;">Salary</th>
                <th style="width: 14%;">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${employees}">
                <td th:text="${e.id}">1</td>
                <td th:text="${e.name}">John Doe</td>
                <td th:text="${e.email}">john@example.com</td>
                <td th:text="${e.department}">IT</td>
                <td th:text="${e.salary}">50000</td>
                <td>
                    <a th:href="@{'/employees/edit/' + ${e.id} + '#employee-form'}" class="btn-edit">Edit</a>
                    <a th:href="@{'/employees/delete/' + ${e.id}}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this employee?');">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Add Employee Form -->
    <div id="employee-form" class="form-section">
        <h2 class="section-title" style="margin-bottom: 20px;" th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}">Add Employee</h2>

        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Email" required>
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label class="form-label">Department</label>
                    <input type="text" th:field="*{department}" class="form-control" placeholder="Department" required>
                </div>
                <div class="form-col">
                    <label class="form-label">Salary</label>
                    <input type="number" th:field="*{salary}" class="form-control" placeholder="5000" required>
                </div>
            </div>

            <button type="submit" class="btn-save">Save</button>
        </form>
    </div>

</div>

</body>
</html>
