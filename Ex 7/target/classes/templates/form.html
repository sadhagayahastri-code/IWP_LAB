<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; color: #333333; }
        .main-container { max-width: 860px; margin: 40px auto; padding: 0 15px; }
        .form-label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }
        .btn-save { background-color: #5cb85c; border-color: #4cae4c; color: #ffffff; }
        .cancel-link { color: #0d6efd; text-decoration: none; margin-left: 12px; }
    </style>
</head>
<body>
<div class="main-container">
    <h3 class="fw-bold mb-4" th:text="${title}">Add Student</h3>

    <form th:action="@{/students}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="col-md-6">
                <label for="course" class="form-label">Course</label>
                <input type="text" id="course" th:field="*{course}" class="form-control" placeholder="CS" required>
            </div>
        </div>

        <div class="mb-4">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="1234567890" required>
        </div>

        <div class="d-flex align-items-center">
            <button type="submit" class="btn btn-save">Save</button>
            <a th:href="@{/students}" class="cancel-link">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
