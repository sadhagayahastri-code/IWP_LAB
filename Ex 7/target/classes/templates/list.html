<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333333;
        }
        .main-container {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 15px;
        }
        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #212529;
        }
        .btn-add-student {
            background-color: #0d6efd;
            border-color: #0d6efd;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 4px;
        }
        .table {
            border-color: #dee2e6;
            margin-bottom: 12px;
        }
        .table th {
            font-weight: 600;
            font-size: 0.875rem;
            color: #212529;
            border-bottom: 2px solid #dee2e6;
            padding: 10px 12px;
        }
        .table td {
            font-size: 0.875rem;
            color: #333333;
            vertical-align: middle;
            padding: 10px 12px;
        }
        .btn-edit {
            background-color: #f0ad4e;
            border-color: #eea236;
            color: #ffffff !important;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 3px;
        }
        .btn-edit:hover {
            background-color: #ec971f;
            border-color: #d58512;
        }
        .btn-delete {
            background-color: #d9534f;
            border-color: #d43f3a;
            color: #ffffff !important;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 3px;
        }
        .btn-delete:hover {
            background-color: #c9302c;
            border-color: #ac2925;
        }
        .btn-save {
            background-color: #5cb85c;
            border-color: #4cae4c;
            color: #ffffff;
            font-weight: 500;
            padding: 6px 18px;
            border-radius: 4px;
        }
        .btn-save:hover {
            background-color: #449d44;
            border-color: #398439;
        }
        .cancel-link {
            color: #0d6efd;
            text-decoration: none;
            font-size: 0.95rem;
            margin-left: 12px;
            cursor: pointer;
        }
        .cancel-link:hover {
            text-decoration: underline;
        }
        .section-heading {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 36px;
            margin-bottom: 18px;
            color: #212529;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #212529;
        }
        .form-control {
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .custom-entries-select {
            display: inline-block !important;
            width: auto !important;
            min-width: 60px;
            font-size: 0.82rem !important;
            padding: 2px 24px 2px 8px !important;
            margin: 0 4px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background-color: #fff;
            vertical-align: middle;
        }
        .entries-text {
            font-size: 0.82rem;
            color: #6c757d;
        }
        .pagination .page-link {
            font-size: 0.82rem;
            padding: 4px 10px;
            color: #0d6efd;
        }
        .pagination .page-item.active .page-link {
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: #ffffff;
        }
        .pagination .page-item.disabled .page-link {
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- Header Row -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="page-title mb-0">Student Records</h2>
        <a href="#student-form" class="btn btn-primary btn-add-student text-white text-decoration-none">
            + Add Student
        </a>
    </div>

    <!-- Table Controls (Show entries) -->
    <div class="d-flex justify-content-end align-items-center mb-2">
        <span class="entries-text">Show 
            <select class="form-select form-select-sm custom-entries-select">
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
            </select>
            entries
        </span>
    </div>

    <!-- Student Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead>
                <tr>
                    <th style="width: 8%;">ID</th>
                    <th style="width: 20%;">Name</th>
                    <th style="width: 25%;">Email</th>
                    <th style="width: 12%;">Course</th>
                    <th style="width: 18%;">Phone</th>
                    <th style="width: 17%;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${students}">
                    <td th:text="${s.id}">1</td>
                    <td th:text="${s.name}">John Doe</td>
                    <td th:text="${s.email}">john@gmail.com</td>
                    <td th:text="${s.course}">CS</td>
                    <td th:text="${s.phone}">9876543210</td>
                    <td>
                        <a th:href="@{'/students/' + ${s.id} + '/edit#student-form'}" 
                           class="btn btn-edit me-1">Edit</a>
                        <form th:action="@{'/students/' + ${s.id} + '/delete'}" 
                              method="post" 
                              style="display:inline;"
                              onsubmit="return confirm('Are you sure you want to delete this student?');">
                            <button type="submit" class="btn btn-delete">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="6" class="text-center text-muted py-3">No student records found.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Table Footer: entries & pagination -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <span class="entries-text">Show 10 entries</span>
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item disabled"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>
    </div>

    <!-- Add/Edit Student Form -->
    <div id="student-form" class="mt-4 pt-2">
        <h3 class="section-heading" th:text="${title ?: 'Add Student'}">Add Student</h3>

        <form th:action="@{/students}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}">

            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" 
                       id="name" 
                       th:field="*{name}" 
                       class="form-control" 
                       placeholder="John Doe" 
                       required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <!-- Email & Course Row -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" 
                           id="email" 
                           th:field="*{email}" 
                           class="form-control" 
                           placeholder="john@example.com" 
                           required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label for="course" class="form-label">Course</label>
                    <input type="text" 
                           id="course" 
                           th:field="*{course}" 
                           class="form-control" 
                           placeholder="CS" 
                           required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
                </div>
            </div>

            <!-- Phone -->
            <div class="mb-4">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" 
                       id="phone" 
                       th:field="*{phone}" 
                       class="form-control" 
                       placeholder="1234567890" 
                       required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <!-- Save & Cancel Buttons -->
            <div class="d-flex align-items-center">
                <button type="submit" class="btn btn-save">Save</button>
                <a th:href="@{/students}" class="cancel-link">Cancel</a>
            </div>
        </form>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
